name: TeleCast
options:
  bundleIdPrefix: fr.telecast
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CastKit:
    path: Packages/CastKit
targets:
  TeleCast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TeleCast
        excludes:
          - Info.plist
          - Resources/TestMedia
          - Resources/TestMedia/**
      - path: TeleCast/Resources/TestMedia
        type: folder
        buildPhase: resources
      - path: WebScripts/src/detector.js
        buildPhase: resources
    dependencies:
      - package: CastKit
        product: CastCore
      - package: CastKit
        product: CastNet
    info:
      path: TeleCast/Info.plist
      properties:
        CFBundleDisplayName: TéléCast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: TéléCast cherche ta TV sur le Wi-Fi et lui envoie les vidéos.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: fr.telecast.castapp
            CFBundleURLSchemes:
              - telecast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.telecast.castapp
        PRODUCT_NAME: TeleCast
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
schemes:
  TeleCast:
    build:
      targets:
        TeleCast: all
    run:
      config: Debug
    archive:
      config: Release
